name: Product site (GitHub Pages)

# Builds the static product landing page + interactive demo and deploys both
# to GitHub Pages.
#
#   https://cygnusnetworks.github.io/auzui/       → marketing landing
#   https://cygnusnetworks.github.io/auzui/demo/  → interactive demo
#
# Runs on release tags (v*) and manual dispatch — not on every main push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build landing + demo
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build demo (base = /auzui/demo/)
        run: VITE_BASE=/auzui/demo/ pnpm --filter auzui-frontend build:demo
      - name: Assemble Pages site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/screenshots _site/demo

          # Landing
          cp site/index.html site/styles.css _site/
          cp frontend/public/logo.svg frontend/public/logo-wordmark.svg frontend/public/favicon.svg _site/assets/

          # Screenshots used by the landing gallery.
          # Both light and dark variants (the landing gallery has a switch).
          for f in \
            problems host-detail latest-data explorer topology metrics logs \
            command-palette
          do
            cp "docs/images/$f.png" "_site/assets/screenshots/$f.png"
            cp "docs/images/$f-dark.png" "_site/assets/screenshots/$f-dark.png"
          done

          # Interactive demo under /demo/
          cp -a frontend/dist/. _site/demo/

          # SPA fallback for demo deep-links under project pages
          if [ -f _site/demo/index.html ]; then
            cp _site/demo/index.html _site/demo/404.html
          fi

          ls -la _site _site/demo _site/assets/screenshots | head -80
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
