name: CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Voreinstellung fuer alle Jobs: nur lesen. Einzelne Jobs, die mehr
# brauchen, deklarieren das selbst.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (all workspace packages)
        run: pnpm -r lint
      - name: Build (all workspace packages)
        run: pnpm -r build
      - name: Test (all workspace packages)
        run: pnpm -r test

  gateway:
    name: Gateway (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies (uv workspace, repo root)
        run: uv sync --package auzui-gateway --extra dev
      - name: Ruff check
        run: uv run ruff check services/gateway/src services/gateway/tests
      - name: Ruff format
        run: uv run ruff format --check services/gateway
      - name: Pytest
        run: uv run pytest services/gateway/tests
