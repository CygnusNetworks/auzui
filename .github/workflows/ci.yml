name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Voreinstellung fuer alle Jobs: nur lesen. Einzelne Jobs, die mehr
# brauchen, deklarieren das selbst.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, build, test)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (all workspace packages)
        run: pnpm -r lint
      - name: Build (all workspace packages)
        run: pnpm -r build
      - name: Test (all workspace packages)
        run: pnpm -r test

  gateway:
    name: Gateway (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176  # v2.17.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install dependencies (uv workspace, repo root)
        run: uv sync --package auzui-gateway --extra dev
      - name: Ruff check
        run: uv run ruff check services/gateway/src services/gateway/tests
      - name: Ruff format
        run: uv run ruff format --check services/gateway
      - name: Pytest
        run: uv run pytest services/gateway/tests
