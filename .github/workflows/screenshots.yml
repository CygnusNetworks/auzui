name: Screenshots (release tags)

# Regenerate the README / docs screenshots from the mock-driven UI and commit
# them back to main. No backend needed — the generator drives the built SPA
# with Playwright and intercepts the Zabbix/gateway API via page.route.
#
# Runs on version tags (v*) and manual dispatch only — not on every push.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    name: Generate & commit screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A tag is not a branch — check out main and base the results on it.
          # Version tags are normally cut from main HEAD, so this reflects the
          # released UI.
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build frontend (served by Playwright's vite preview)
        run: pnpm --filter auzui-frontend build:demo
      - name: Install Playwright chromium
        run: pnpm --filter auzui-frontend exec playwright install --with-deps chromium
      - name: Generate screenshots (light)
        env:
          SCREENSHOTS: "1"
        run: pnpm --filter auzui-frontend exec playwright test screenshots --project=chromium
      - name: Generate screenshots (dark)
        env:
          SCREENSHOTS: "1"
          THEME: "dark"
        run: pnpm --filter auzui-frontend exec playwright test screenshots --project=chromium
      # Why a pull request and not a push to main: the main-protection ruleset
      # requires one ("GH013: Changes must be made through a pull request"), and
      # the Actions bot cannot be added as a bypass actor — GitHub rejects it
      # with "Actor GitHub Actions integration must be part of the ruleset
      # source or owner organization", because it is not an installed app. This
      # step used to push straight to main and started failing once the
      # ruleset went in (v0.3.8): a red workflow on a release tag blocks
      # nothing else, so it went unnoticed.
      - name: Open a pull request with the regenerated screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          # On a tag that is the version; a manual run is not a release, so name
          # it after the run instead of calling the branch "screenshots-main".
          LABEL: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
        run: |
          set -euo pipefail
          BRANCH="chore/screenshots-${LABEL}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            echo "Screenshots unchanged for ${LABEL}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "docs(screenshots): regenerate for ${LABEL} [skip ci]"
          # Force: a re-run of the same tag should replace its branch, not fail.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "docs(screenshots): regenerate for ${LABEL}" \
              --body "Automatisch erzeugt fuer \`${LABEL}\` (Workflow \`screenshots.yml\`). Nur \`docs/images/*.png\`.")
          fi
          echo "Pull request: $url"

          # The ruleset needs no approvals and no status checks, so the merge
          # normally goes through right here. If it does not, the branch and the
          # PR still hold the work — an open PR is a far better signal than the
          # silent push failure this replaces, so do not fail the job for it.
          if gh pr merge "$url" --squash --delete-branch; then
            echo "Merged $url into main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Screenshots konnten nicht automatisch gemerged werden — PR offen: $url"
            {
              echo "**Screenshots warten auf einen Merge von Hand:** $url"
              echo ""
              echo "Der Auto-Merge wurde abgelehnt. Bis der PR gemerged ist, zeigen"
              echo "README und Produktseite die Screenshots des vorherigen Releases."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
