name: Docker

# Runs only on release tags (v*): multi-arch linux/amd64 + linux/arm64.
# Manual dispatch can force multi-arch via the multiarch input (otherwise
# native linux/amd64 only — fast, no QEMU).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      multiarch:
        description: "Build multi-arch (amd64 + arm64) even without a v* tag"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/cygnusnetworks/auzui
  DOCKERHUB_IMAGE: cygnusnetworks/auzui

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    env:
      # Docker Hub push is optional: it only happens when the secrets are configured.
      HAS_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}
      # Multi-arch on release tags, or when workflow_dispatch forces it.
      MULTIARCH: ${{ (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.multiarch)) && 'true' || 'false' }}
    steps:
      - name: Harden runner
        # Ueberwacht ausgehende Verbindungen des Jobs. Bewusst "audit":
        # blockiert nichts, meldet aber ungewoehnliche Ziele. Auf "block"
        # umstellen erst, wenn die Allowlist aus den Audit-Berichten steht --
        # sonst brechen Builds an harmlosen Zielen.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags so `git describe` can compute the tag distance.
          fetch-depth: 0

      - name: Compute version string
        id: version
        run: |
          echo "describe=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Determine platforms
        id: platforms
        run: |
          if [ "${MULTIARCH}" = "true" ]; then
            echo "list=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "label=multi-arch (amd64+arm64)" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "label=amd64 only" >> "$GITHUB_OUTPUT"
          fi
          echo "Building for: $( [ "${MULTIARCH}" = "true" ] && echo multi-arch || echo amd64-only )"

      - name: Determine target images
        id: images
        run: |
          {
            echo 'list<<EOF'
            echo "${GHCR_IMAGE}"
            if [ "${HAS_DOCKERHUB}" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up QEMU
        if: env.MULTIARCH == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push (${{ steps.platforms.outputs.label }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.describe }}
            AUZUI_VERSION=${{ steps.version.outputs.describe }}
            AUZUI_GIT_SHA=${{ github.sha }}
            AUZUI_BUILD_TIME=${{ steps.version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the Docker Hub repository description in sync with README.md.
      # Docker Hub cannot resolve repo-relative links, so rewrite them to
      # absolute GitHub URLs (raw for images, blob for documents) first.
      - name: Prepare Docker Hub README
        if: env.HAS_DOCKERHUB == 'true'
        run: |
          sed \
            -e 's#](\./docs/images/#](https://raw.githubusercontent.com/CygnusNetworks/auzui/main/docs/images/#g' \
            -e 's#](\./#](https://github.com/CygnusNetworks/auzui/blob/main/#g' \
            README.md > README.dockerhub.md

      # NOTE: DOCKER_TOKEN must be an access token with "Read & Write"
      # scope (or the account password) — a pull-only token can push
      # images via login-action but cannot update the description.
      - name: Sync README to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: ./README.dockerhub.md
          short-description: "auzui — A Usable Zabbix UI. Modern monitoring SPA + gateway for Zabbix."
