# Bekannte, bewusst zurueckgestellte Funde des OSV-Scanners.
#
# Sinn dieser Datei: der Supply-Chain-Workflow soll GRUEN starten. Ein Scanner,
# der wegen Altlasten dauerhaft rot steht, wird nach zwei Wochen ignoriert --
# und genau dann uebersieht man den einen Fund, auf den es ankommt.
#
# Jeder Eintrag hat ein ignoreUntil. Danach schlaegt der Scan wieder an, der
# Fund kommt also automatisch zurueck auf den Tisch statt still zu verschwinden.
# Neue Funde sind von dieser Datei nicht betroffen und brechen den Workflow
# sofort.
#
# GHSA-rgw5-rvv9-x895 (brace-expansion, zurueckgestellt bis 2026-09-03) ist
# durch ein spaeteres eslint-Update behoben und daher nicht mehr im Lockfile
# -- der Eintrag wurde entfernt, weil der Scanner ihn sonst als "unused
# ignore" meldet.
