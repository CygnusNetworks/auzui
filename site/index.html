<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>auzui — A Usable Zabbix UI</title>
  <meta name="description" content="auzui is a modern, self-hosted monitoring SPA for Zabbix — coming soon." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0d12;
      --bg-glow: #10151d;
      --fg: #e6e9ee;
      --muted: #8b97a8;
      --accent: #5fd0ff;
      --accent-2: #7c8cff;
      --border: #1f2733;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(95, 208, 255, 0.12), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(124, 140, 255, 0.10), transparent 60%),
        var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    main {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      margin-bottom: 1.75rem;
    }
    .badge::before {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    h1 {
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      line-height: 1.1;
      margin: 0 0 0.75rem;
      background: linear-gradient(120deg, var(--fg), var(--accent) 60%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
    }
    p.tagline {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 auto 2.25rem;
      max-width: 520px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #0a0d12;
      font-weight: 600;
      text-decoration: none;
      padding: 0.75rem 1.4rem;
      border-radius: 0.6rem;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .cta:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    footer a {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Coming soon</span>
    <h1>auzui</h1>
    <p class="tagline">
      A Usable Zabbix UI — a modern, dark-mode-first monitoring SPA that runs
      alongside your existing Zabbix installation, with zero-config deep
      observability built in.
    </p>
    <a class="cta" href="https://github.com/cygnusnetworks/auzui">
      View the project on GitHub →
    </a>
    <footer>
      <a href="https://github.com/cygnusnetworks/auzui">github.com/cygnusnetworks/auzui</a>
    </footer>
  </main>
</body>
</html>
