[project]
name = "auzui-gateway"
version = "0.3.0"
description = "auzui gateway — hides Influx/Graylog tokens, enforces Zabbix permissions, serves the SPA"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Cygnus Networks GmbH" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.52.0",
]

[project.optional-dependencies]
kerberos = [
    "gssapi>=1.9.0",
]
docker = [
    "docker>=7",
    "paramiko>=3",
]
yaml = [
    "pyyaml>=6",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.9",
    # config_file.py's YAML path is exercised in tests; keep it installed in
    # dev so those tests actually run instead of being importorskip'd.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auzui_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
